# Ontora deployment. The Postgres instance is provisioned separately in the
# same workspace and region; referencing it here preserves its existing data.
services:
  - type: web
    name: ontora-clawvisor
    runtime: docker
    repo: https://github.com/ontora-main/clawvisor
    branch: main
    autoDeployTrigger: commit
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ontora-clawvisor-db
          property: connectionString
      - key: AUTH_MODE
        value: password
      # 0 removes the account cap; enrollment still requires an admin invite.
      - key: MAX_USERS
        value: "0"
      - key: ALLOWED_EMAILS
        value: max@ontora.com
      - key: AUTH_REQUIRE_INVITE
        value: "true"
      - key: DATABASE_DRIVER
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_BACKEND
        value: local
      - key: VAULT_KEY
        generateValue: true
      - key: IMESSAGE_ENABLED
        value: "false"
      - key: CALLBACK_REQUIRE_HTTPS
        value: "true"
      - key: TELEMETRY_ENABLED
        value: "false"
