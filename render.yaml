# Ontora deployment. The Postgres instance is provisioned separately in the
# same workspace and region; referencing it here preserves its existing data.
services:
  - type: web
    name: ontora-clawvisor
    runtime: docker
    repo: https://github.com/ontora-main/clawvisor
    branch: main
    autoDeployTrigger: commit
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    domains:
      - clawvisor.ontora.com
    renderSubdomainPolicy: disabled
    envVars:
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: PUBLIC_URL
        value: https://clawvisor.ontora.com
      - key: DATABASE_URL
        fromDatabase:
          name: ontora-clawvisor-db
          property: connectionString
      - key: AUTH_MODE
        value: password
      # SSO enrollment is restricted to the exact founder identities below.
      - key: MAX_USERS
        value: "0"
      - key: ALLOWED_EMAILS
        value: max@ontora.com,leon@ontora.com,david@ontora.com
      - key: ACCESS_SSO_ENABLED
        value: "true"
      - key: ACCESS_SSO_ISSUER
        value: https://ontorainc.cloudflareaccess.com
      - key: ACCESS_SSO_AUDIENCE
        value: 7dbbb2a8c55493f856fb59fe21c6ac6c18af54d32074a4545351e4f406207626
      - key: ACCESS_SSO_EMAILS
        value: max@ontora.com,leon@ontora.com,david@ontora.com
      - key: ACCESS_SSO_BOOTSTRAP_ADMIN
        value: max@ontora.com
      - key: AUTH_REQUIRE_INVITE
        value: "true"
      - key: DATABASE_DRIVER
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_BACKEND
        value: local
      - key: VAULT_KEY
        generateValue: true
      - key: IMESSAGE_ENABLED
        value: "false"
      - key: CALLBACK_REQUIRE_HTTPS
        value: "true"
      - key: TELEMETRY_ENABLED
        value: "false"
